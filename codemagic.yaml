# Codemagic CI/CD configuration for Al Merrikh
# Replaces the UI-defined "Default Workflow" so signing + publishing live in the repo.
#
# Required setup in Codemagic UI (one time):
#   The App Store Connect API key is named "App Manager" (role: App Manager,
#   key QYNHS5D392) under Settings > Integrations > Developer Portal.
#   Environment variables: a group named "shorebird" holding SHOREBIRD_TOKEN,
#   marked secure. `shorebird login:ci` is gone - create an API key at
#   console.shorebird.dev while signed in as ksagulfcar@gmail.com, which is
#   the account that owns the app_id in shorebird.yaml. A key from any other
#   account fails with "Could not find app with id".
#   Environment variables: a group named "appstore_signing" holding
#   CERTIFICATE_PRIVATE_KEY (an RSA private key in PEM form), marked secure.
#   fetch-signing-files signs the CSR with it; without it no certificate or
#   profile is created and the export falls back to an empty ad-hoc plist.

workflows:
  ios-appstore:
    name: iOS - App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "App Manager"

    environment:
      # Pinned deliberately: an unpinned 'stable' changed how plugins are
      # integrated (Swift Package Manager) and broke Build 18 — the Podfile
      # fixes for ITMS-90683 were silently bypassed. Match the local SDK.
      flutter: 3.32.8
      xcode: latest
      cocoapods: default
      groups:
        - shorebird
        - appstore_signing
      vars:
        BUNDLE_ID: com.nextkick.almerrikh

    scripts:
      - name: Fetch packages
        script: |
          # Flutter stable (3.44+) integrates plugins through Swift Package
          # Manager by default, which bypasses ios/Podfile entirely: the
          # PICKER_MEDIA / PERMISSION_* settings there never reach the build
          # and file_picker's Package.swift pulls DKImagePickerController ->
          # DKCamera -> CoreLocation (ITMS-90683). Force CocoaPods.
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Set up code signing
        script: |
          # Creates the bundle id, Apple Distribution certificate and App Store
          # provisioning profile if they do not exist yet, then writes
          # $HOME/export_options.plist with method=app-store.
          # A development profile is what caused App Store Connect error 90161.
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Install Shorebird
        script: |
          curl --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh -sSf | bash
          echo 'PATH=$PATH:$HOME/.shorebird/bin' >> $CM_ENV

      - name: Shorebird release (App Store IPA)
        script: |
          # export_options.plist is written by `xcode-project use-profiles` with
          # method=app-store, so the archive is signed for distribution.
          # PROJECT_BUILD_NUMBER is the app-wide counter (BUILD_NUMBER is per
          # workflow and would restart at a number already used). Shorebird
          # releases are immutable, so every run needs a fresh build number.
          # Never reuse a build number App Store Connect has already seen:
          # builds 16 and 17 were pushed to TestFlight, so 18 is the floor.
          # Builds 16, 17 and 18 have all been seen by App Store Connect, so 19
          # is the floor now — a reused build number is rejected on upload.
          # Build 19 may already exist too (iOS push fix), so 20 is the floor.
          BUILD_NO=$(( PROJECT_BUILD_NUMBER > 20 ? PROJECT_BUILD_NUMBER : 20 ))
          echo "Using build number $BUILD_NO"
          shorebird release ios \
            --export-options-plist=$HOME/export_options.plist \
            -- --build-number=$BUILD_NO

      - name: Verify no CoreLocation in IPA (ITMS-90683 gates)
        script: |
          # No Mac in-house, so the Build 18 gates run here. Any failure aborts
          # the workflow before the TestFlight upload below.
          bash docs/apple_review/build18_location_gates.sh pods
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          bash docs/apple_review/build18_location_gates.sh ipa "$IPA"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
