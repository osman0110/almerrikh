# Codemagic CI/CD configuration for Al Merrikh
# Replaces the UI-defined "Default Workflow" so signing + publishing live in the repo.
#
# Required setup in Codemagic UI (one time):
#   Teams > Integrations > Developer Portal -> add App Store Connect API key named "AppStoreConnect".
#   The key's Apple Developer account must own the bundle id com.nextkick.almerrikh.
#   Environment variables: create a group named "shorebird" holding SHOREBIRD_TOKEN
#   (generate it locally with `shorebird login:ci`), marked secure.

workflows:
  ios-appstore:
    name: iOS - App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: AppStoreConnect

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - shorebird
      ios_signing:
        # App Store distribution profile - NOT development.
        # A development profile is what caused App Store Connect error 90161.
        distribution_type: app_store
        bundle_identifier: com.nextkick.almerrikh

    scripts:
      - name: Fetch packages
        script: flutter pub get

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Install Shorebird
        script: |
          curl --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh -sSf | bash
          echo 'PATH=$PATH:$HOME/.shorebird/bin' >> $CM_ENV

      - name: Shorebird release (App Store IPA)
        script: |
          # export_options.plist is written by `xcode-project use-profiles` with
          # method=app-store, so the archive is signed for distribution.
          # BUILD_NUMBER is Codemagic's auto-incrementing counter - Shorebird
          # releases are immutable, so every run needs a fresh build number.
          shorebird release ios \
            --export-options-plist=$HOME/export_options.plist \
            -- --build-number=$BUILD_NUMBER

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
