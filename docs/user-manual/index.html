<title>دليل استخدام منصة المريخ</title>
<style>
  @font-face {
    font-family: 'system-stack';
  }

  :root {
    --bg: #F6F2EC;
    --surface: #FFFFFF;
    --surface-2: #FBF8F3;
    --border: #E4DBCC;
    --text: #221A15;
    --muted: #786C5E;
    --accent: #A81E2C;
    --accent-ink: #FFFFFF;
    --accent-soft: #F6E2E2;
    --gold: #9C7A2E;
    --gold-soft: #F1E7CC;
    --focus: #1F5FBF;
    --shadow: 0 1px 2px rgba(30,20,10,0.06), 0 8px 24px -12px rgba(30,20,10,0.18);
    --radius: 14px;
    --font-display: 800 1rem/1.2 'Segoe UI', 'Tahoma', 'Arial', system-ui, sans-serif;
    --font-body: 400 1rem/1.65 'Segoe UI', 'Tahoma', 'Arial', system-ui, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14100E;
      --surface: #1C1613;
      --surface-2: #221A16;
      --border: #362A22;
      --text: #F2EAE0;
      --muted: #A9998A;
      --accent: #E5424F;
      --accent-ink: #1A0B0C;
      --accent-soft: #3A1B1D;
      --gold: #D8B673;
      --gold-soft: #34291A;
      --focus: #7FB3FF;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 12px 32px -14px rgba(0,0,0,0.6);
    }
  }

  :root[data-theme="dark"] {
    --bg: #14100E;
    --surface: #1C1613;
    --surface-2: #221A16;
    --border: #362A22;
    --text: #F2EAE0;
    --muted: #A9998A;
    --accent: #E5424F;
    --accent-ink: #1A0B0C;
    --accent-soft: #3A1B1D;
    --gold: #D8B673;
    --gold-soft: #34291A;
    --focus: #7FB3FF;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 12px 32px -14px rgba(0,0,0,0.6);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  body { overflow-x: hidden; }

  [dir="rtl"] body { font-family: 'Segoe UI', 'Tahoma', 'Arial', system-ui, sans-serif; }

  :lang(en) h1, :lang(en) h2, :lang(en) h3, :lang(en) .eyebrow,
  :lang(fr) h1, :lang(fr) h2, :lang(fr) h3, :lang(fr) .eyebrow {
    letter-spacing: 0.01em;
  }

  h1, h2, h3 { font: var(--font-display); margin: 0; text-wrap: balance; color: var(--text); }

  a { color: inherit; }

  button { font-family: inherit; cursor: pointer; }

  button:focus-visible, [tabindex]:focus-visible, a:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
    border-radius: 6px;
  }

  /* ---------- Shell ---------- */

  .shell {
    display: flex;
    min-height: 100vh;
  }

  [dir="rtl"] .shell { flex-direction: row; }

  .sidebar {
    width: 272px;
    flex: none;
    background: var(--surface-2);
    border-inline-end: 1px solid var(--border);
    padding: 22px 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    position: sticky;
    top: 0;
    align-self: flex-start;
    height: 100vh;
    overflow-y: auto;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 6px 10px;
    border-bottom: 1px solid var(--border);
  }

  .brand-mark {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(155deg, var(--accent), #7A1019);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font: 800 15px/1 'Segoe UI', sans-serif;
    flex: none;
    box-shadow: var(--shadow);
  }

  .brand-text { display: flex; flex-direction: column; gap: 1px; }
  .brand-title { font: 800 14px/1.3 'Segoe UI', sans-serif; }
  .brand-sub { font-size: 11.5px; color: var(--muted); }

  .lang-switch {
    display: flex;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
  }

  .lang-switch button {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--muted);
    padding: 7px 4px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 700;
    transition: background .15s, color .15s;
  }

  .lang-switch button.active {
    background: var(--accent);
    color: var(--accent-ink);
  }

  .nav-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 4px 8px 0;
  }

  [dir="rtl"] .nav-label { letter-spacing: 0; }

  .role-nav { display: flex; flex-direction: column; gap: 4px; }

  .role-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: start;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 10px;
    padding: 9px 10px;
    color: var(--text);
    font-size: 13.5px;
    font-weight: 600;
  }

  .role-btn:hover { background: var(--surface); }

  .role-btn.active {
    background: var(--surface);
    border-color: var(--border);
    box-shadow: var(--shadow);
  }

  .role-badge {
    width: 28px;
    height: 28px;
    flex: none;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font: 800 12px/1 'Segoe UI', sans-serif;
    color: var(--accent-ink);
    background: var(--accent);
  }

  .role-btn.active .role-badge { background: var(--gold); color: #1A140A; }

  .role-name { flex: 1; }

  .sidebar-foot {
    margin-top: auto;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    font-size: 11.5px;
    color: var(--muted);
    line-height: 1.5;
  }

  /* ---------- Main ---------- */

  .main {
    flex: 1;
    min-width: 0;
    padding: 40px clamp(20px, 4vw, 56px) 80px;
  }

  .role-header {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    padding-bottom: 22px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 28px;
  }

  .role-header .role-badge { width: 52px; height: 52px; border-radius: 14px; font-size: 19px; }

  .eyebrow {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 6px;
  }

  .role-header h1 { font-size: clamp(22px, 2.6vw, 30px); }

  .role-intro { color: var(--muted); font-size: 14.5px; max-width: 62ch; margin-top: 8px; }

  .who-sees {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .chip {
    font-size: 11.5px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 999px;
    background: var(--gold-soft);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .workflow-grid {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .workflow-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .workflow-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
  }

  .workflow-num {
    font: 800 13px/1 'Segoe UI', sans-serif;
    color: var(--accent);
    flex: none;
  }

  .workflow-head h2 { font-size: 16px; }

  .workflow-body { padding: 8px 20px 18px; }

  ol.steps {
    margin: 0;
    padding: 0;
    list-style: none;
    counter-reset: step;
    display: flex;
    flex-direction: column;
  }

  ol.steps li {
    counter-increment: step;
    display: flex;
    gap: 12px;
    padding: 10px 0;
    border-top: 1px dashed var(--border);
    font-size: 14px;
    line-height: 1.6;
  }

  ol.steps li:first-child { border-top: none; }

  ol.steps li::before {
    content: counter(step);
    flex: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    font: 800 11.5px/22px 'Segoe UI', sans-serif;
    text-align: center;
  }

  .step-text b, .step-text strong { color: var(--text); }
  .step-text .screen {
    display: inline-block;
    background: var(--gold-soft);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0 6px;
    font-size: 12.5px;
    font-weight: 700;
  }

  .note {
    margin-top: 22px;
    display: flex;
    gap: 10px;
    padding: 13px 16px;
    border-radius: 10px;
    background: var(--gold-soft);
    border: 1px solid var(--border);
    font-size: 13.5px;
    color: var(--text);
  }

  .note b { color: var(--gold); }

  /* ---------- Mobile ---------- */

  .topbar { display: none; }

  @media (max-width: 860px) {
    .shell { flex-direction: column; }
    .sidebar {
      position: static;
      width: 100%;
      height: auto;
      border-inline-end: none;
      border-bottom: 1px solid var(--border);
      padding: 14px 14px 10px;
    }
    .role-nav {
      flex-direction: row;
      overflow-x: auto;
      gap: 8px;
      padding-bottom: 4px;
    }
    .role-btn { flex: none; }
    .sidebar-foot { display: none; }
    .main { padding: 24px 18px 60px; }
  }

  @media (prefers-reduced-motion: no-preference) {
    .lang-switch button, .role-btn { transition: background .15s ease, color .15s ease; }
  }
</style>

<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">AM</div>
      <div class="brand-text">
        <div class="brand-title" id="brandTitle">دليل الاستخدام</div>
        <div class="brand-sub" id="brandSub">نادي المريخ</div>
      </div>
    </div>

    <div class="lang-switch" role="group" aria-label="Language">
      <button data-lang="ar" class="active">العربية</button>
      <button data-lang="en">English</button>
      <button data-lang="fr">Français</button>
    </div>

    <div>
      <div class="nav-label" id="navLabel">الأدوار</div>
      <nav class="role-nav" id="roleNav"></nav>
    </div>

    <div class="sidebar-foot" id="sidebarFoot"></div>
  </aside>

  <main class="main" id="main"></main>
</div>

  var state = { lang: "ar", role: "player" };

  function dir(lang) { return lang === "ar" ? "rtl" : "ltr"; }

  function render() {
    var lang = state.lang;
    document.documentElement.lang = lang;
    document.documentElement.dir = dir(lang);

    document.getElementById("brandTitle").textContent = UI[lang].brandTitle;
    document.getElementById("brandSub").textContent = UI[lang].brandSub;
    document.getElementById("navLabel").textContent = UI[lang].rolesLabel;
    document.getElementById("sidebarFoot").textContent = UI[lang].foot;

    document.querySelectorAll(".lang-switch button").forEach(function (btn) {
      btn.classList.toggle("active", btn.getAttribute("data-lang") === lang);
    });

    var nav = document.getElementById("roleNav");
    nav.innerHTML = "";
    ROLES.forEach(function (role) {
      var btn = document.createElement("button");
      btn.className = "role-btn" + (role.id === state.role ? " active" : "");
      btn.setAttribute("data-role", role.id);
      btn.innerHTML =
        '<span class="role-badge">' + role.initial[lang] + '</span>' +
        '<span class="role-name">' + role.name[lang] + '</span>';
      btn.addEventListener("click", function () {
        state.role = role.id;
        render();
      });
      nav.appendChild(btn);
    });

    var role = ROLES.find(function (r) { return r.id === state.role; }) || ROLES[0];
    var main = document.getElementById("main");
    main.innerHTML = "";

    var header = document.createElement("div");
    header.className = "role-header";
    header.innerHTML =
      '<span class="role-badge">' + role.initial[lang] + '</span>' +
      '<div>' +
        '<p class="eyebrow">' + role.eyebrow[lang] + '</p>' +
        '<h1>' + role.name[lang] + '</h1>' +
        '<p class="role-intro">' + role.intro[lang] + '</p>' +
        '<div class="who-sees" aria-label="' + UI[lang].whoSees + '">' +
          role.sees[lang].map(function (s) { return '<span class="chip">' + s + '</span>'; }).join("") +
        '</div>' +
      '</div>';
    main.appendChild(header);

    var grid = document.createElement("div");
    grid.className = "workflow-grid";
    role.workflows.forEach(function (wf, i) {
      var card = document.createElement("div");
      card.className = "workflow-card";
      var stepsHtml = wf.steps[lang].map(function (s) {
        return '<li><span class="step-text">' + s + '</span></li>';
      }).join("");
      card.innerHTML =
        '<div class="workflow-head">' +
          '<span class="workflow-num">' + String(i + 1).padStart(2, "0") + '</span>' +
          '<h2>' + wf.title[lang] + '</h2>' +
        '</div>' +
        '<div class="workflow-body"><ol class="steps">' + stepsHtml + '</ol></div>';
      grid.appendChild(card);
    });
    main.appendChild(grid);

    if (role.note) {
      var note = document.createElement("div");
      note.className = "note";
      note.innerHTML = '<span>' + role.note[lang] + '</span>';
      main.appendChild(note);
    }
  }

  document.querySelectorAll(".lang-switch button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      state.lang = btn.getAttribute("data-lang");
      render();
    });
  });

  render();
})();
</script>
